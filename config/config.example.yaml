open_loyalty:
  base_url: http://localhost:8181/api
  api_key: YOUR_OPEN_LOYALTY_TOKEN
  store_code: default

voucherify:
  base_url: https://api.voucherify.io/v1
  application_id: YOUR_APP_ID
  secret_key: YOUR_SECRET_KEY
